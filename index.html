<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
  <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo claro">
    <span class="theme-icon" aria-hidden="true">☁</span><span class="theme-label">DARK</span>
  </button>
  <details class="controls-box">
    <summary>CONTROLES</summary>
  </details>
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <aside class="panel panel-left">
        <div class="panel-section off" id="hold-section">
          <span class="label">HOLD (C)</span>
          <canvas id="hold-canvas" width="80" height="80"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">ENERGÍA (E)</span>
          <progress id="energy" max="10" value="0"></progress>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>

        <div class="stats">
          <div class="panel-section">
            <span class="label">LINES</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LEVEL</span>
            <span class="value" id="level">1</span>
          </div>
          <div class="panel-section">
            <span class="label">COMBO</span>
            <span class="value" id="combo">—</span>
          </div>
          <div class="panel-section">
            <span class="label">OBJETIVO</span>
            <span class="value" id="goal">—</span>
          </div>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="80" height="80"></canvas>
          <canvas id="queue-canvas" width="80" height="192" hidden></canvas>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <p id="overlay-title">TETRIS</p>
        <div id="overlay-stats" hidden>
          <span>Nivel <b id="stat-level"></b></span>
          <span>Puntaje <b id="stat-score"></b></span>
        </div>
        <div class="overlay-cols">
          <section class="overlay-col">
            <h2>Partida</h2>
            <button id="resume-btn" hidden>Reanudar</button>
            <button id="restart-btn" hidden>Reiniciar</button>
            <label class="start-level">Nivel inicial
              <select id="start-level">
                <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
                <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
              </select>
            </label>
            <details id="pause-controls" hidden><summary>Ver controles</summary></details>
          </section>
          <section class="overlay-col">
            <h2>Modo de juego</h2>
            <button class="mode-btn" data-mode="0">Normal<small>Sin límite</small></button>
            <button class="mode-btn" data-mode="1">Desafío 1<small>40 líneas en 2:00</small></button>
            <button class="mode-btn" data-mode="2">Desafío 2<small>Sobrevive 2:00</small></button>
            <button class="mode-btn" data-mode="3">Desafío 3<small>Limpia los fijos</small></button>
          </section>
        </div>
      </div>
    </div>
  </div>

  <ul class="controls">
    <li><kbd>←</kbd><kbd>→</kbd> mover</li>
    <li><kbd>↑</kbd> rotar</li>
    <li><kbd>↓</kbd> bajar</li>
    <li><kbd>Space</kbd> caída</li>
    <li><kbd>P</kbd> pausa</li>
    <li><kbd>E</kbd> habilidad</li>
    <li><kbd>C</kbd> hold</li>
  </ul>
  </main>

  <script src="game.js"></script>
</body>
</html>
