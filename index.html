<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
  <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo claro">
    <span class="theme-icon" aria-hidden="true">☁</span><span class="theme-label">DARK</span>
  </button>
  <details class="controls-box">
    <summary>CONTROLES</summary>
  </details>
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <aside class="panel panel-left">
        <div class="panel-section off" id="hold-section">
          <span class="label">HOLD (C)</span>
          <canvas id="hold-canvas" width="80" height="80"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">ENERGÍA (E)</span>
          <progress id="energy" max="10" value="0"></progress>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>

        <div class="stats">
          <div class="panel-section">
            <span class="label">LINES</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LEVEL</span>
            <span class="value" id="level">1</span>
          </div>
          <div class="panel-section">
            <span class="label">COMBO</span>
            <span class="value" id="combo">—</span>
          </div>
          <div class="panel-section">
            <span class="label">OBJETIVO</span>
            <span class="value" id="goal">—</span>
          </div>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="80" height="80"></canvas>
          <canvas id="queue-canvas" width="80" height="192" hidden></canvas>
        </div>

        <div class="panel-section">
          <span class="label">SKIN</span>
          <div class="skins">
            <button class="skin-btn" type="button" data-skin="retro" aria-pressed="false"><canvas width="28" height="28"></canvas>RETRO</button>
            <button class="skin-btn" type="button" data-skin="neon" aria-pressed="false"><canvas width="28" height="28"></canvas>NEON</button>
            <button class="skin-btn" type="button" data-skin="pastel" aria-pressed="false"><canvas width="28" height="28"></canvas>PASTEL</button>
            <button class="skin-btn" type="button" data-skin="pixel" aria-pressed="false"><canvas width="28" height="28"></canvas>PIXEL</button>
            <button class="skin-btn" type="button" data-skin="lcd" aria-pressed="false"><canvas width="28" height="28"></canvas>LCD</button>
            <button class="skin-btn" type="button" data-skin="glass" aria-pressed="false"><canvas width="28" height="28"></canvas>VIDRIO</button>
            <button class="skin-btn" type="button" data-skin="blueprint" aria-pressed="false"><canvas width="28" height="28"></canvas>PLANO</button>
            <button class="skin-btn" type="button" data-skin="outrun" aria-pressed="false"><canvas width="28" height="28"></canvas>OUTRUN</button>
            <button class="skin-btn" type="button" data-skin="goma" aria-pressed="false"><canvas width="28" height="28"></canvas>GOMA</button>
            <button class="skin-btn" type="button" data-skin="vintage" aria-pressed="false"><canvas width="28" height="28"></canvas>VINTAGE</button>
            <button class="skin-btn" type="button" data-skin="crt" aria-pressed="false"><canvas width="28" height="28"></canvas>CRT</button>
            <button class="skin-btn" type="button" data-skin="wood" aria-pressed="false"><canvas width="28" height="28"></canvas>MADERA</button>
          </div>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <p id="overlay-title">TETRIS</p>
        <p id="overlay-score"></p>
        <button id="restart-btn" hidden>Reiniciar</button>
        <button class="mode-btn" data-mode="0">Normal</button>
        <button class="mode-btn" data-mode="1">Desafío 1: 40 líneas en 2:00</button>
        <button class="mode-btn" data-mode="2">Desafío 2: sobrevive 2:00</button>
        <button class="mode-btn" data-mode="3">Desafío 3: limpia los fijos</button>
      </div>
    </div>
  </div>

  <ul class="controls">
    <li><kbd>←</kbd><kbd>→</kbd> mover</li>
    <li><kbd>↑</kbd> rotar</li>
    <li><kbd>↓</kbd> bajar</li>
    <li><kbd>Space</kbd> caída</li>
    <li><kbd>P</kbd> pausa</li>
    <li><kbd>E</kbd> habilidad</li>
    <li><kbd>C</kbd> hold</li>
  </ul>
  </main>

  <script src="game.js"></script>
</body>
</html>
